<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1340" viewBox="0 0 1340 1340" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1340" height="1340" fill="#ffffff"/>
  <text x="40" y="44" font-size="26" font-weight="bold" fill="#111827">FitHub — Entity-Relationship Diagram</text>
  <g font-size="14" fill="#334155">
    <rect x="950" y="12" width="360" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="966" y="34"><tspan font-weight="bold" fill="#dc2626">PK</tspan> = primary key (ObjectId)</text>
    <text x="966" y="54"><tspan font-weight="bold" fill="#1d4ed8">FK</tspan> = reference to another collection</text>
  </g>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <!-- ============ ENTITY: USER ============ -->
  <g>
    <rect x="40" y="70" width="290" height="238" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
    <rect x="40" y="70" width="290" height="46" rx="10" fill="#1d4ed8"/>
    <rect x="40" y="100" width="290" height="16" fill="#1d4ed8"/>
    <text x="185" y="100" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">USER</text>
    <g font-size="15" fill="#1e293b">
      <text x="56" y="142">_id <tspan font-weight="bold" fill="#dc2626">PK</tspan></text>
      <text x="56" y="168">name</text>
      <text x="56" y="194">email (unique)</text>
      <text x="56" y="220">phone</text>
      <text x="56" y="246">password (hashed)</text>
      <text x="56" y="272">role: member / admin</text>
      <text x="56" y="298">currentMembership</text>
    </g>
  </g>

  <!-- ============ REL: enrolls ============ -->
  <line x1="330" y1="190" x2="340" y2="190" stroke="#334155" stroke-width="2.5"/>
  <polygon points="330,155 440,190 330,225" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="385" y="195" font-size="14" font-weight="bold" fill="#92400e" text-anchor="middle">enrolls</text>
  <line x1="440" y1="190" x2="450" y2="190" stroke="#334155" stroke-width="2.5"/>
  <text x="322" y="192" font-size="14" font-weight="bold" fill="#334155" text-anchor="end">1</text>
  <text x="458" y="192" font-size="14" font-weight="bold" fill="#334155">N</text>

  <!-- ============ ENTITY: MEMBERSHIP ============ -->
  <g>
    <rect x="450" y="70" width="320" height="342" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
    <rect x="450" y="70" width="320" height="46" rx="10" fill="#1d4ed8"/>
    <rect x="450" y="100" width="320" height="16" fill="#1d4ed8"/>
    <text x="610" y="100" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">MEMBERSHIP</text>
    <g font-size="15" fill="#1e293b">
      <text x="466" y="142">_id <tspan font-weight="bold" fill="#dc2626">PK</tspan></text>
      <text x="466" y="168">user <tspan font-weight="bold" fill="#1d4ed8">FK → users</tspan></text>
      <text x="466" y="194">subscription <tspan font-weight="bold" fill="#1d4ed8">FK → plans</tspan></text>
      <text x="466" y="220">startDate, endDate</text>
      <text x="466" y="246">status: active / expired</text>
      <text x="466" y="272">totalAmount</text>
      <text x="466" y="298">amountPaid</text>
      <text x="466" y="324">amountRemaining</text>
      <text x="466" y="350">paymentStatus</text>
      <text x="466" y="376">paymentMethod</text>
      <text x="466" y="402">notes, remindersSent</text>
    </g>
  </g>

  <!-- ============ REL: of plan ============ -->
  <line x1="770" y1="190" x2="780" y2="190" stroke="#334155" stroke-width="2.5"/>
  <polygon points="770,155 880,190 770,225" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="825" y="195" font-size="14" font-weight="bold" fill="#92400e" text-anchor="middle">of plan</text>
  <line x1="880" y1="190" x2="890" y2="190" stroke="#334155" stroke-width="2.5"/>
  <text x="762" y="192" font-size="14" font-weight="bold" fill="#334155" text-anchor="end">N</text>
  <text x="898" y="192" font-size="14" font-weight="bold" fill="#334155">1</text>

  <!-- ============ ENTITY: SUBSCRIPTION ============ -->
  <g>
    <rect x="890" y="70" width="290" height="264" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
    <rect x="890" y="70" width="290" height="46" rx="10" fill="#1d4ed8"/>
    <rect x="890" y="100" width="290" height="16" fill="#1d4ed8"/>
    <text x="1035" y="100" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">SUBSCRIPTION</text>
    <g font-size="15" fill="#1e293b">
      <text x="906" y="142">_id <tspan font-weight="bold" fill="#dc2626">PK</tspan></text>
      <text x="906" y="168">name</text>
      <text x="906" y="194">price</text>
      <text x="906" y="220">duration, durationUnit</text>
      <text x="906" y="246">features[]</text>
      <text x="906" y="272">isActive, isPopular</text>
      <text x="906" y="298">createdAt</text>
    </g>
  </g>

  <!-- ============ ENTITY: PRODUCT ============ -->
  <g>
    <rect x="40" y="450" width="290" height="238" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
    <rect x="40" y="450" width="290" height="46" rx="10" fill="#1d4ed8"/>
    <rect x="40" y="480" width="290" height="16" fill="#1d4ed8"/>
    <text x="185" y="480" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">PRODUCT</text>
    <g font-size="15" fill="#1e293b">
      <text x="56" y="522">_id <tspan font-weight="bold" fill="#dc2626">PK</tspan></text>
      <text x="56" y="548">name</text>
      <text x="56" y="574">price</text>
      <text x="56" y="600">stockQuantity</text>
      <text x="56" y="626">sizes[], image</text>
      <text x="56" y="652">category</text>
      <text x="56" y="678">isAvailable</text>
    </g>
  </g>

  <!-- ============ REL: contains ============ -->
  <line x1="330" y1="568" x2="340" y2="568" stroke="#334155" stroke-width="2.5"/>
  <polygon points="340,533 440,568 340,603" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="390" y="573" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">contains</text>
  <line x1="440" y1="568" x2="450" y2="568" stroke="#334155" stroke-width="2.5"/>
  <text x="322" y="570" font-size="14" font-weight="bold" fill="#334155" text-anchor="end">1</text>
  <text x="458" y="570" font-size="14" font-weight="bold" fill="#334155">N</text>

  <!-- ============ ENTITY: ORDER ============ -->
  <g>
    <rect x="450" y="450" width="320" height="290" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
    <rect x="450" y="450" width="320" height="46" rx="10" fill="#1d4ed8"/>
    <rect x="450" y="480" width="320" height="16" fill="#1d4ed8"/>
    <text x="610" y="480" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">ORDER</text>
    <g font-size="15" fill="#1e293b">
      <text x="466" y="522">_id <tspan font-weight="bold" fill="#dc2626">PK</tspan></text>
      <text x="466" y="548">user <tspan font-weight="bold" fill="#1d4ed8">FK → users</tspan></text>
      <text x="466" y="574">product <tspan font-weight="bold" fill="#1d4ed8">FK → products</tspan></text>
      <text x="466" y="600">quantity</text>
      <text x="466" y="626">totalAmount</text>
      <text x="466" y="652">paymentMethod</text>
      <text x="466" y="678">paymentStatus</text>
      <text x="466" y="704">status, address</text>
      <text x="466" y="730">createdAt</text>
    </g>
  </g>

  <!-- ============ REL: places (ORDER -> USER) ============ -->
  <path d="M600,450 L600,425 L185,425 L185,308" fill="none" stroke="#334155" stroke-width="2.5"/>
  <polygon points="185,325 230,360 185,395 140,360" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="185" y="365" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">places</text>
  <text x="614" y="444" font-size="14" font-weight="bold" fill="#334155">N</text>
  <text x="185" y="320" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">1</text>

  <!-- ============ REL: generates ============ -->
  <line x1="770" y1="240" x2="780" y2="240" stroke="#334155" stroke-width="2.5"/>
  <polygon points="775,205 885,240 775,275" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="830" y="245" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">generates</text>
  <line x1="885" y1="240" x2="890" y2="240" stroke="#334155" stroke-width="2.5"/>
  <text x="762" y="242" font-size="14" font-weight="bold" fill="#334155" text-anchor="end">1</text>
  <text x="898" y="242" font-size="14" font-weight="bold" fill="#334155">N</text>

  <!-- ============ ENTITY: TRANSACTION ============ -->
  <g>
    <rect x="890" y="450" width="300" height="212" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
    <rect x="890" y="450" width="300" height="46" rx="10" fill="#1d4ed8"/>
    <rect x="890" y="480" width="300" height="16" fill="#1d4ed8"/>
    <text x="1040" y="480" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">TRANSACTION</text>
    <g font-size="15" fill="#1e293b">
      <text x="906" y="522">membership <tspan font-weight="bold" fill="#1d4ed8">FK</tspan></text>
      <text x="906" y="548">amount</text>
      <text x="906" y="574">date</text>
      <text x="906" y="600">method</text>
      <text x="906" y="626">notes, receiptNo</text>
    </g>
  </g>

  <!-- ============ ENTITY: REVIEW ============ -->
  <g>
    <rect x="40" y="790" width="290" height="212" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
    <rect x="40" y="790" width="290" height="46" rx="10" fill="#1d4ed8"/>
    <rect x="40" y="820" width="290" height="16" fill="#1d4ed8"/>
    <text x="185" y="820" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">REVIEW</text>
    <g font-size="15" fill="#1e293b">
      <text x="56" y="862">_id <tspan font-weight="bold" fill="#dc2626">PK</tspan></text>
      <text x="56" y="888">user <tspan font-weight="bold" fill="#1d4ed8">FK → users</tspan></text>
      <text x="56" y="914">name, rating</text>
      <text x="56" y="940">comment</text>
      <text x="56" y="966">status, createdAt</text>
    </g>
  </g>

  <!-- ============ REL: written by (USER -> REVIEW trunk) ============ -->
  <path d="M40,250 L20,250 L20,730 L55,730" fill="none" stroke="#334155" stroke-width="2.5"/>
  <polygon points="55,695 145,730 55,765" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="100" y="726" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">written</text>
  <text x="100" y="740" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">by</text>
  <line x1="145" y1="730" x2="145" y2="790" stroke="#334155" stroke-width="2.5"/>
  <text x="14" y="266" font-size="14" font-weight="bold" fill="#334155">1</text>
  <text x="153" y="784" font-size="14" font-weight="bold" fill="#334155">N</text>

  <!-- ============ ENTITY: PROGRESS ============ -->
  <g>
    <rect x="890" y="790" width="300" height="290" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
    <rect x="890" y="790" width="300" height="46" rx="10" fill="#1d4ed8"/>
    <rect x="890" y="820" width="300" height="16" fill="#1d4ed8"/>
    <text x="1040" y="820" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">PROGRESS</text>
    <g font-size="15" fill="#1e293b">
      <text x="906" y="862">_id <tspan font-weight="bold" fill="#dc2626">PK</tspan></text>
      <text x="906" y="888">user <tspan font-weight="bold" fill="#1d4ed8">FK → users</tspan></text>
      <text x="906" y="914">date</text>
      <text x="906" y="940">weight</text>
      <text x="906" y="966">chest, waist</text>
      <text x="906" y="992">biceps, thighs</text>
      <text x="906" y="1018">note</text>
      <text x="906" y="1044">createdAt</text>
    </g>
  </g>

  <!-- ============ REL: logs (USER -> PROGRESS with bridge over places line) ============ -->
  <path d="M300,308 L300,440 L592,440 A8,8 0 0 0 608,440 L820,440 L820,900 L890,900" fill="none" stroke="#334155" stroke-width="2.5"/>
  <polygon points="775,625 865,660 775,695" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="820" y="665" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">logs</text>
  <text x="300" y="324" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">1</text>
  <text x="880" y="904" font-size="14" font-weight="bold" fill="#334155" text-anchor="end">N</text>

  <!-- ============ ENTITY: CALENDAR EVENT ============ -->
  <g>
    <rect x="40" y="1050" width="290" height="212" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
    <rect x="40" y="1050" width="290" height="46" rx="10" fill="#1d4ed8"/>
    <rect x="40" y="1080" width="290" height="16" fill="#1d4ed8"/>
    <text x="185" y="1080" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">CALENDAR EVENT</text>
    <g font-size="15" fill="#1e293b">
      <text x="56" y="1122">_id <tspan font-weight="bold" fill="#dc2626">PK</tspan></text>
      <text x="56" y="1148">title, date, type</text>
      <text x="56" y="1174">color, description</text>
      <text x="56" y="1200">createdBy <tspan font-weight="bold" fill="#1d4ed8">FK → users</tspan></text>
      <text x="56" y="1228" font-size="13" font-style="italic" fill="#64748b">created by Admin (role = admin)</text>
    </g>
  </g>

  <!-- ============ ENTITY: BANNER ============ -->
  <g>
    <rect x="450" y="1050" width="320" height="238" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
    <rect x="450" y="1050" width="320" height="46" rx="10" fill="#1d4ed8"/>
    <rect x="450" y="1080" width="320" height="16" fill="#1d4ed8"/>
    <text x="610" y="1080" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">BANNER</text>
    <g font-size="15" fill="#1e293b">
      <text x="466" y="1122">_id <tspan font-weight="bold" fill="#dc2626">PK</tspan></text>
      <text x="466" y="1148">title, image</text>
      <text x="466" y="1174">buttonText, buttonLink</text>
      <text x="466" y="1200">position, isActive</text>
      <text x="466" y="1228">createdAt</text>
      <text x="466" y="1256" font-size="13" font-style="italic" fill="#64748b">published by Admin (role = admin)</text>
    </g>
  </g>

  <!-- ============ ENTITY: OTP ============ -->
  <g>
    <rect x="890" y="1050" width="300" height="186" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
    <rect x="890" y="1050" width="300" height="46" rx="10" fill="#1d4ed8"/>
    <rect x="890" y="1080" width="300" height="16" fill="#1d4ed8"/>
    <text x="1040" y="1080" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">OTP</text>
    <g font-size="15" fill="#1e293b">
      <text x="906" y="1122">email / phone</text>
      <text x="906" y="1148">otp, purpose</text>
      <text x="906" y="1174">expiresAt, createdAt</text>
      <text x="906" y="1202" font-size="13" font-style="italic" fill="#64748b">issued for a User (login / reset)</text>
    </g>
  </g>
</svg>
